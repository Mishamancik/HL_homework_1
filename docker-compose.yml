services:
  app-msk:
    build: ./app
    image: hometask1-app:local
    environment:
      DATACENTER: msk
      POD_ID: msk001
      LISTEN_ADDR: ":8080"
      FAULT_500_RATE: ${FAULT_500_RATE:-0.03}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  app-spb:
    build: ./app
    image: hometask1-app:local
    environment:
      DATACENTER: spb
      POD_ID: spb001
      LISTEN_ADDR: ":8080"
      FAULT_500_RATE: ${FAULT_500_RATE:-0.03}
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      app-msk:
        condition: service_healthy
      app-spb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  dashboard-generator:
    build: ./dashboard-generator
    image: hometask1-dashboard-generator:local
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USER: ${GRAFANA_ADMIN_USER}
      GRAFANA_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      APP_HANDLERS_URL: http://app-msk:8080/handlers
      PROMETHEUS_DATASOURCE_UID: prometheus
    depends_on:
      app-msk:
        condition: service_healthy
      app-spb:
        condition: service_healthy
      grafana:
        condition: service_healthy
    restart: "no"

  load-generator:
    build: ./load-generator
    image: hometask1-load-generator:local
    environment:
      TARGETS: http://app-msk:8080,http://app-spb:8080
      TARGET_RPS: ${TARGET_RPS:-40}
      RAMP_DURATION: ${RAMP_DURATION:-3m}
      ERROR_404_RATE: ${ERROR_404_RATE:-0.03}
      WORKERS: ${LOAD_WORKERS:-32}
    depends_on:
      dashboard-generator:
        condition: service_completed_successfully
      app-msk:
        condition: service_healthy
      app-spb:
        condition: service_healthy
    restart: unless-stopped
